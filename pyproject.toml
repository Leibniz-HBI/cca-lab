[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textlab-classify"
version = "0.3.0"
description = "Persistent LLM text classification workbench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "pyarrow>=17,<26", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.package-data]
textlab = ["static/*"]

[tool.setuptools.packages.find]
include = ["textlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
