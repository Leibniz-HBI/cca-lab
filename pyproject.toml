[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cca-lab"
dynamic = ["version"]
description = "Persistent LLM text classification workbench"
requires-python = ">=3.11"
dependencies = ["jsonschema[format]>=4.23,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "pyarrow>=17,<26", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.package-data]
cca_lab = ["static/*", "schemas/*.json", "schema.sql"]

[tool.setuptools.packages.find]
include = ["cca_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["access_control: explicit authentication and authorization tests"]

[tool.setuptools.dynamic]
version = {attr = "cca_lab.__version__"}
